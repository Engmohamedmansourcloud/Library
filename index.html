<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دفتر المكتبة</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap">
<style>
:root{--bg:#fff;--ink:#111;--mut:#6b6b6b;--ln:#e3e3e3;--bd:#f3f3f3;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.7 Cairo,Tahoma,Arial,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.w{max-width:820px;margin:0 auto;padding:12px}
h1{background:#111;color:#fff;padding:10px 14px;border-radius:10px;font-size:20px;font-weight:800;margin:4px 0 10px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.tabs button{white-space:nowrap;border:1px solid var(--ln);background:#fff;color:var(--ink);padding:6px 12px;border-radius:8px;font:inherit;font-size:14px;cursor:pointer}
.tabs button.on{background:#111;color:#fff;border-color:#111;font-weight:600}
.pg{background:#fff;border:1px solid var(--ln);border-inline-start:4px solid #111;border-radius:10px;padding:14px;margin-top:8px}
.pg h2{font-size:18px;margin:0 0 8px;font-weight:800}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.row:last-child{border:0}
small,.mut{color:var(--mut);font-size:13px}
input,select{font:inherit;font-size:15px;padding:8px 10px;border:1px solid var(--ln);border-radius:8px;background:#fff;color:var(--ink);width:100%}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 2px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.b{border:0;background:#111;color:#fff;padding:7px 14px;border-radius:8px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.b.r{background:#fff;color:#111;border:1px solid #111}.b.o{background:#fff;color:#111;border:1px solid var(--ln)}
.b:disabled{opacity:.4;cursor:default}
.tag{font-size:12px;padding:1px 8px;border-radius:20px;border:1px solid currentColor;white-space:nowrap}
.t-p{color:var(--mut)}.t-a{background:#111;color:#fff;border-color:#111}.t-x{color:#111;border-style:dashed}.t-d{color:var(--mut)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chips button{border:1px solid var(--ln);background:#fff;color:var(--ink);border-radius:20px;padding:2px 12px;font:inherit;font-size:13px;cursor:pointer}
.chips button.on{background:#111;color:#fff}
.card{width:120px;height:76px;border-radius:8px;border:1px dashed var(--mut);background:var(--bd);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--mut);overflow:hidden}
.card img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.ok{background:#111;color:#fff;padding:8px 12px;border-radius:8px;margin-top:8px;font-size:14px}
.badge{background:#111;color:#fff;border-radius:20px;font-size:11px;padding:0 6px;margin-inline-start:4px}
.ft{margin:22px 0 10px;padding:14px;background:#111;color:#fff;border-radius:10px;text-align:center}.ft1{font-size:12px;color:#bdbdbd;margin-bottom:2px}.ft2{font-size:13px;font-weight:600;line-height:1.7}
.lk{background:none;border:0;color:var(--ink);text-decoration:underline;font:inherit;cursor:pointer;padding:0}
</style>
</head>
<body>
<div class="w">
<h1>دفتر المكتبة الإلكتروني</h1>
<div id="app"><p class="mut">بنحمّل...</p></div>
<div class="ft"><div class="ft1">تصميم وإعداد وتنفيذ</div><div class="ft2">مهندس / محمد منصور علي</div><div class="ft2">مهندسة / رواء عبد اللطيف</div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
var DEPTS=['أدب','علوم','تاريخ','دين','تكنولوجيا'];
var sb=supabase.createClient('https://bphndtfolrbhsuejgzni.supabase.co','sb_publishable_xfe39kCmGvOh4pnn0V8daw_E53HebFp');
var me=null,tab='',msg='',q='',dept='الكل',fdate='',C={},scr='login';
var LB={pending:['منتظر','t-p'],approved:['موافق - مع الطالب','t-a'],rejected:['مرفوض','t-x'],returned:['تم الإرجاع','t-d']};
function $(i){return document.getElementById(i)}
function gv(i){var e=$(i);return e?e.value.trim():''}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function em(c){return String(c).trim().toLowerCase()+'@mktba.app'}
function okc(c){return /^[A-Za-z0-9]{3,30}$/.test(c)}
function fmt(d){return new Date(d).toLocaleString('ar-EG',{dateStyle:'short',timeStyle:'short'})}
function tg(k){return '<span class="tag '+LB[k][1]+'">'+LB[k][0]+'</span>'}
function note(){return msg?'<div class="ok">'+esc(msg)+'</div>':''}
function say(m){msg=m;render()}
function E(r){if(r.error){msg='حصل خطأ: '+r.error.message;return true}return false}
function page(h){$('app').innerHTML=h}
function csv(name,rows){var t='\ufeff'+rows.map(function(r){return r.map(function(c){return '"'+String(c==null?'':c).replace(/"/g,'""')+'"'}).join(',')}).join('\n');var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv;charset=utf-8'}));a.download=name+'.csv';a.click()}

/* ---------- auth ---------- */
function loginV(){return '<div class="pg"><h2>تسجيل الدخول</h2><label>الكود (من الكارنيه)</label><input id="lc" autocomplete="username"><label>كلمة السر</label><input id="lp" type="password" autocomplete="current-password"><p><button class="b" onclick="doLogin()">دخول</button></p><p class="mut">لسه معندكش حساب؟ <button class="lk" onclick="scr=\'reg\';msg=\'\';render()">سجّل حساب جديد</button></p>'+note()+'</div>'}
function regV(){return '<div class="pg"><h2>حساب جديد</h2><div class="g"><div><label>الاسم</label><input id="rn"></div><div><label>الشعبة</label><input id="rs"></div><div><label>الكود (من الكارنيه، إنجليزي وأرقام)</label><input id="rc" autocomplete="username"></div><div><label>كلمة السر (6 على الأقل)</label><input id="rp" type="password" autocomplete="new-password"></div></div><label>صورة الكارنيه</label><input id="rf" type="file" accept="image/*"><p><button class="b" onclick="doReg()">ابعت للمراجعة</button> <button class="b o" onclick="scr=\'login\';msg=\'\';render()">رجوع</button></p><p class="mut">الحساب مش هيشتغل غير بعد ما المكتبة تراجع الكارنيه وتوافق، وصورة الكارنيه بتتمسح بعد المراجعة.</p>'+note()+'</div>'}
function waitV(){var rj=me&&me.status=='rejected';return '<div class="pg"><h2>'+(rj?'طلبك اترفض':'حسابك قيد المراجعة')+'</h2><p>'+(rj?'كلّم مديرة المكتبة.':'هتقدر تدخل أول ما المكتبة توافق عليه.')+'</p><p>'+(rj?'':'<button class="b" onclick="loadMe()">حدّث الحالة</button> ')+'<button class="b o" onclick="out()">خروج</button></p></div>'}
async function doLogin(){var c=gv('lc'),p=$('lp').value;if(!c||!p)return say('اكتب الكود وكلمة السر.');var r=await sb.auth.signInWithPassword({email:em(c),password:p});if(r.error)return say('الكود أو كلمة السر غلط.');msg='';await loadMe()}
async function doReg(){var n=gv('rn'),s=gv('rs'),c=gv('rc'),p=$('rp').value,f=$('rf').files[0];
 if(!n||!s||!c||!f)return say('اكتب كل البيانات وارفع صورة الكارنيه.');
 if(!okc(c))return say('الكود أرقام وحروف إنجليزي بس (3 على الأقل).');
 if(p.length<6)return say('كلمة السر لازم 6 حروف على الأقل.');
 msg='بنسجّل حسابك...';render();
 var a=await sb.auth.signUp({email:em(c),password:p});
 if(a.error)return say(/registered/i.test(a.error.message)?'الكود ده مسجّل قبل كده.':'حصل خطأ: '+a.error.message);
 if(!a.data.session)return say('إعداد Supabase ناقص: اقفل Confirm email.');
 var uid=a.data.user.id,ext=(f.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg',path=uid+'/card.'+ext;
 var u=await sb.storage.from('cards').upload(path,f);
 if(u.error)return say('فشل رفع الصورة: '+u.error.message);
 var i=await sb.from('profiles').insert({id:uid,full_name:n,section:s,code:c,card_path:path});
 if(i.error)return say('حصل خطأ: '+i.error.message);
 msg='';await loadMe()}
async function loadMe(){var u=await sb.auth.getUser();if(!u.data||!u.data.user){scr='login';return render()}
 var r=await sb.from('profiles').select('*').eq('id',u.data.user.id).maybeSingle();me=r.data;
 if(!me){await sb.auth.signOut();scr='login';msg='الحساب ده مش مكتمل. سجّل حساب جديد.';return render()}
 if(me.status!='approved'){scr='wait';return render()}
 scr='app';tab=me.role=='student'?'att':'acc';msg='';await load(tab);render()}
async function out(){await sb.auth.signOut();me=null;C={};scr='login';msg='';render()}

/* ---------- data ---------- */
async function load(t){var r;
 if(t=='books'||t=='bk'){r=await sb.from('books').select('*').order('dept').order('title');if(!E(r))C.books=r.data;
  if(t=='books'){r=await sb.from('loans').select('book_id,status').eq('student_id',me.id).in('status',['pending','approved']);if(!E(r))C.act=r.data}}
 if(t=='my'){r=await sb.from('loans').select('id,status,created_at,books(title)').eq('student_id',me.id).order('created_at',{ascending:false});if(!E(r))C.my=r.data}
 if(t=='acc'){r=await sb.from('profiles').select('*').eq('status','pending').order('created_at');if(!E(r)){C.acc=r.data;C.url={};var ps=r.data.filter(function(x){return x.card_path}).map(function(x){return x.card_path});if(ps.length){var s=await sb.storage.from('cards').createSignedUrls(ps,600);(s.data||[]).forEach(function(x){C.url[x.path]=x.signedUrl})}}}
 if(t=='loans'){r=await sb.from('loans').select('id,status,created_at,books(title),profiles!student_id(full_name,code)').order('created_at',{ascending:false}).limit(200);if(!E(r))C.loans=r.data}
 if(t=='log'){var qy=sb.from('attendance').select('at,profiles!student_id(full_name,section,code)').order('at',{ascending:false}).limit(500);if(fdate){var a=new Date(fdate+'T00:00:00'),b=new Date(a.getTime()+864e5);qy=qy.gte('at',a.toISOString()).lt('at',b.toISOString())}r=await qy;if(!E(r))C.log=r.data}
 if(t=='as'){r=await sb.from('profiles').select('id,full_name,code,role').in('role',['assistant','manager']).order('full_name');if(!E(r))C.as=r.data}}
async function go(t){tab=t;msg='';await load(t);render()}
function tabsL(){if(me.role=='student')return [['att','تسجيل الحضور'],['books','الكتب'],['my','طلباتي']];
 var l=[['acc','طلبات الحساب'+(C.np?'<span class="badge">'+C.np+'</span>':'')],['loans','الاستعارة'],['log','دفتر الحضور'],['bk','الكتب']];if(me.role=='manager')l.push(['as','المساعدين']);return l}
async function render(){
 if(scr=='login')return page(loginV());if(scr=='reg')return page(regV());if(scr=='wait')return page(waitV());
 var staff=me.role!='student';
 if(staff){var r=await sb.from('profiles').select('id',{count:'exact',head:true}).eq('status','pending');C.np=r.count||0}
 page('<div class="row" style="border:0"><span class="mut">أهلاً '+esc(me.full_name)+(staff?(me.role=='manager'?' (مديرة المكتبة)':' (مساعد)'):'')+'</span><button class="b o" onclick="out()">خروج</button></div><div class="tabs">'+tabsL().map(function(t){return '<button class="'+(tab==t[0]?'on':'')+'" onclick="go(\''+t[0]+'\')">'+t[1]+'</button>'}).join('')+'</div>'+V[tab]())}
function keep(el){q=el.value;var p=q.length;render();var e=$('q');e.focus();e.setSelectionRange(p,p)}

/* ---------- views ---------- */
var V={
att:function(){return '<div class="pg"><h2>سجّل دخولك المكتبة</h2><div class="g"><div><label>الاسم</label><input value="'+esc(me.full_name)+'" readonly></div><div><label>الشعبة</label><input value="'+esc(me.section)+'" readonly></div><div><label>الكود</label><input value="'+esc(me.code)+'" readonly></div></div><p><button class="b" onclick="doAtt()">سجّل حضوري</button></p>'+note()+'</div>'},
books:function(){var act=C.act||[],l=(C.books||[]).filter(function(b){return (dept=='الكل'||b.dept==dept)&&(b.title+(b.author||'')).indexOf(q)>-1});
 return '<div class="pg"><h2>كتب المكتبة</h2><input id="q" placeholder="ابحث بالعنوان أو المؤلف" value="'+esc(q)+'" oninput="keep(this)"><div class="chips">'+['الكل'].concat(DEPTS).map(function(d){return '<button class="'+(dept==d?'on':'')+'" onclick="dept=\''+d+'\';render()">'+d+'</button>'}).join('')+'</div>'+
 (l.length?l.map(function(b){var has=act.some(function(x){return x.book_id==b.id});return '<div class="row"><div><b>'+esc(b.title)+'</b><br><small>'+esc(b.author||'')+' - قسم '+esc(b.dept)+' - متاح '+b.copies+' نسخة</small></div><button class="b" '+(b.copies<1||has?'disabled':'')+' onclick="req('+b.id+')">'+(has?'اتطلب':b.copies<1?'غير متاح':'اطلب استعارة')+'</button></div>'}).join(''):'<p class="mut">مفيش كتب مطابقة.</p>')+note()+'</div>'},
my:function(){var l=C.my||[];return '<div class="pg"><h2>طلبات الاستعارة بتاعتي</h2>'+(l.length?l.map(function(x){return '<div class="row"><div><b>'+esc(x.books?x.books.title:'')+'</b><br><small>'+fmt(x.created_at)+'</small></div>'+tg(x.status)+'</div>'}).join(''):'<p class="mut">لسه معملتش طلب.</p>')+note()+'</div>'},
acc:function(){var l=C.acc||[];return '<div class="pg"><h2>طلبات الحساب الجديدة</h2><p class="mut">اضغط على صورة الكارنيه لتكبيرها وقارن الكود بالمكتوب.</p>'+(l.length?l.map(function(x){var u=C.url&&C.url[x.card_path];return '<div class="row"><div style="display:flex;gap:10px;align-items:center"><div class="card">'+(u?'<img src="'+u+'" onclick="window.open(this.src)">':'مفيش صورة')+'</div><div><b>'+esc(x.full_name)+'</b><br><small>'+esc(x.section)+' - الكود '+esc(x.code)+'</small></div></div><div><button class="b" onclick="dec(\''+x.id+'\',1)">طابق وأوافق</button> <button class="b r" onclick="dec(\''+x.id+'\',0)">ارفض</button></div></div>'}).join(''):'<p class="mut">مفيش طلبات منتظرة.</p>')+note()+'</div>'},
loans:function(){var l=C.loans||[];return '<div class="pg"><h2>سجل الاستعارة</h2><p><button class="b o" onclick="go(\'loans\')">تحديث</button> <button class="b o" onclick="expLoans()">تصدير Excel</button></p>'+(l.length?l.map(function(x){var a=x.status=='pending'?'<button class="b" onclick="setLoan('+x.id+',\'approved\')">وافق</button> <button class="b r" onclick="setLoan('+x.id+',\'rejected\')">ارفض</button>':x.status=='approved'?'<button class="b o" onclick="setLoan('+x.id+',\'returned\')">سجّل الإرجاع</button>':'';return '<div class="row"><div><b>'+esc(x.books?x.books.title:'')+'</b><br><small>'+esc(x.profiles?x.profiles.full_name+' ('+x.profiles.code+')':'')+' - '+fmt(x.created_at)+'</small></div><div>'+tg(x.status)+' '+a+'</div></div>'}).join(''):'<p class="mut">مفيش استعارات لسه.</p>')+note()+'</div>'},
log:function(){var l=C.log||[];return '<div class="pg"><h2>دفتر الحضور</h2><label>فلترة بالتاريخ</label><input type="date" value="'+fdate+'" onchange="fdate=this.value;go(\'log\')"><p><button class="b o" onclick="expLog()">تصدير Excel</button></p>'+(l.length?l.map(function(x){var s=x.profiles||{};return '<div class="row"><div><b>'+esc(s.full_name)+'</b><br><small>'+esc(s.section)+' - الكود '+esc(s.code)+'</small></div><small>'+fmt(x.at)+'</small></div>'}).join(''):'<p class="mut">مفيش تسجيلات.</p>')+note()+'</div>'},
bk:function(){var bs=C.books||[];return '<div class="pg"><h2>إدارة الكتب</h2><div class="g"><div><label>العنوان</label><input id="bt"></div><div><label>المؤلف</label><input id="ba"></div><div><label>القسم</label><select id="bd">'+DEPTS.map(function(d){return '<option>'+d+'</option>'}).join('')+'</select></div><div><label>عدد النسخ</label><input id="bc" type="number" min="1" value="1"></div></div><p><button class="b" onclick="addB()">أضف الكتاب</button></p>'+DEPTS.map(function(d){var l=bs.filter(function(b){return b.dept==d});return l.length?'<h3 style="font-size:15px;margin:12px 0 0">قسم '+d+'</h3>'+l.map(function(b){return '<div class="row"><div><b>'+esc(b.title)+'</b> <small>'+esc(b.author||'')+' - '+b.copies+' نسخة</small></div><button class="b r" onclick="delB('+b.id+')">احذف</button></div>'}).join(''):''}).join('')+note()+'</div>'},
as:function(){var l=C.as||[];return '<div class="pg"><h2>المساعدين</h2><p class="mut">المساعد لازم يكون عنده حساب موافَق عليه. اكتب كوده عشان تحوّله لمساعد.</p>'+l.map(function(a){return '<div class="row"><div><b>'+esc(a.full_name)+'</b> <small>'+esc(a.code)+(a.role=='manager'?' - مديرة':'')+'</small></div>'+(a.role=='assistant'?'<button class="b r" onclick="setRole(\''+a.id+'\',\'student\')">شيل</button>':'')+'</div>'}).join('')+'<label>كود المساعد الجديد</label><input id="ac"><p><button class="b" onclick="addA()">أضف مساعد</button></p>'+note()+'</div>'}
};

/* ---------- actions ---------- */
async function doAtt(){var r=await sb.from('attendance').insert({student_id:me.id});say(r.error?'حصل خطأ: '+r.error.message:'اتسجل حضورك '+fmt(new Date())+'.')}
async function req(id){var r=await sb.from('loans').insert({book_id:id,student_id:me.id});if(r.error)return say('حصل خطأ: '+r.error.message);await load('books');msg='الطلب اتبعت. مديرة المكتبة هتوافق عليه وهتلاقي حالته في "طلباتي".';render()}
async function dec(id,ok){var x=(C.acc||[]).filter(function(a){return a.id==id})[0];var r=await sb.from('profiles').update({status:ok?'approved':'rejected',card_path:null}).eq('id',id);if(r.error)return say('حصل خطأ: '+r.error.message);if(x&&x.card_path)await sb.storage.from('cards').remove([x.card_path]);await load('acc');msg=ok?'اتفعّل الحساب وصورة الكارنيه اتمسحت.':'اترفض الطلب وصورة الكارنيه اتمسحت.';render()}
async function setLoan(id,st){var r=await sb.from('loans').update({status:st,decided_by:me.id}).eq('id',id);if(r.error)return say(/no copies/.test(r.error.message)?'مفيش نسخ متاحة من الكتاب ده.':'حصل خطأ: '+r.error.message);await load('loans');msg='اتحدّث السجل.';render()}
async function addB(){var t=gv('bt');if(!t)return say('اكتب عنوان الكتاب.');var r=await sb.from('books').insert({title:t,author:gv('ba')||null,dept:$('bd').value,copies:Math.max(1,+gv('bc')||1)});if(r.error)return say('حصل خطأ: '+r.error.message);await load('bk');msg='اتضاف الكتاب.';render()}
async function delB(id){if(!confirm('تحذف الكتاب وكل استعاراته؟'))return;var r=await sb.from('books').delete().eq('id',id);if(r.error)return say('حصل خطأ: '+r.error.message);await load('bk');render()}
async function addA(){var c=gv('ac');if(!c)return;var r=await sb.from('profiles').update({role:'assistant'}).eq('code',c).eq('status','approved').eq('role','student').select();if(r.error)return say('حصل خطأ: '+r.error.message);if(!r.data.length)return say('مفيش طالب موافَق عليه بالكود ده.');await load('as');msg='اتضاف المساعد.';render()}
async function setRole(id,role){var r=await sb.from('profiles').update({role:role}).eq('id',id);if(r.error)return say('حصل خطأ: '+r.error.message);await load('as');render()}
function expLog(){csv('attendance',[['الاسم','الشعبة','الكود','الوقت']].concat((C.log||[]).map(function(x){var s=x.profiles||{};return [s.full_name,s.section,s.code,fmt(x.at)]})))}
function expLoans(){csv('loans',[['الكتاب','الطالب','الكود','الحالة','التاريخ']].concat((C.loans||[]).map(function(x){var s=x.profiles||{};return [x.books?x.books.title:'',s.full_name,s.code,LB[x.status][0],fmt(x.created_at)]})))}

sb.auth.getSession().then(function(r){if(r.data.session)loadMe();else render()});
</script>
